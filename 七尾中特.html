    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Tải dữ liệu thất bại");
            });
    }

    function getPredictForKy(kyNum) {
        let key = ((kyNum - 1) % 366) + 1;
        return PREDICT_366[key];
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    // Định dạng số trúng: Chữ trúng sẽ có hiệu ứng bôi vàng + chữ đỏ, các chữ số còn lại và chữ 尾 giữ nguyên màu đỏ (#FF0000)
    function formatWinText(predictedStr, hitTail) {
        let tailIndex = predictedStr.indexOf('尾');
        let numbersPart = tailIndex !== -1 ? predictedStr.substring(0, tailIndex) : predictedStr;
        let resultHtml = '';

        for (let char of numbersPart) {
            if (char === hitTail) {
                resultHtml += `<span class="win-digit">${char}</span>`;
            } else {
                resultHtml += `${char}`;
            }
        }

        resultHtml += `尾`;
        return resultHtml;
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animalB = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        let animalE = (r.c[4] && r.c[4].v !== null && r.c[4].v !== undefined) ? String(r.c[4].v).trim() : '';
                        
                        if (formattedNum) {
                            if (animalB) duLieuMapB[formattedNum] = animalB;
                            if (animalE) duLieuMapE[formattedNum] = animalE;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let lastXRowIndex = -1;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r) continue;

                    let isXRow = false;
                    for (let colIdx = 1; colIdx <= 7; colIdx++) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            if (String(r[colIdx].v).trim().toLowerCase() === 'x') {
                                isXRow = true;
                                break;
                            }
                        }
                    }

                    if (isXRow) {
                        lastXRowIndex = i;
                        continue;
                    }

                    if (!r[0] || r[0].v === null || r[0].v === undefined) continue;

                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            rowIndex: i,
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    item.useMapE = (lastXRowIndex !== -1 && item.rowIndex > lastXRowIndex);
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let winEntries = [];
            let consecutiveLosses = 0;

            for (let i = doneList.length - 1; i >= 0; i--) {
                let item = doneList[i];
                let predictedChoice = getPredictForKy(item.kyNum);
                
                let activeMap = item.useMapE ? duLieuMapE : duLieuMapB;
                let actualShengXiao = activeMap[item.numTe] || duLieuMapB[item.numTe] || '';

                let numVal = parseInt(item.numTe, 10);
                let lastDigit = item.numTe.slice(-1);

                let isWin = false;
                if (!isNaN(numVal) && numVal >= 1 && numVal <= 49) {
                    if (predictedChoice.includes(lastDigit)) {
                        isWin = true;
                    }
                }

                if (isWin) {
                    consecutiveLosses = 0;
                    winEntries.push({ 
                        item, 
                        predicted: predictedChoice, 
                        hitTail: lastDigit,
                        shengXiaoWin: actualShengXiao 
                    });
                    if (winEntries.length === 14) {
                        break;
                    }
                } else {
                    consecutiveLosses++;
                    if (consecutiveLosses >= 3) {
                        break;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            // Khôi phục chuẩn xác theo mẫu HTML của bạn
            let htmlNextKy = `<p style="font-family:宋体;font-size:medium;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrNext}期:<span style="color:blue;">七尾中特</span>【<span style="color:#FF0000;">${predictNext}</span>】开:？00准</p>`;

            let historyOutputs = [];

            for (let i = 0; i < winEntries.length; i++) {
                let entry = winEntries[i];
                let kyStr = formatThreeDigits(entry.item.kyNum);
                let formattedPredictHtml = formatWinText(entry.predicted, entry.hitTail);

                historyOutputs.push(`<p style="font-family:宋体;font-size:medium;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr}期:<span style="color:blue;">七尾中特</span>【<span style="color:#FF0000;">${formattedPredictHtml}</span>】开:${entry.shengXiaoWin}${entry.item.numTe}准</p>`);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:宋体;font-size:medium;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr1}期:<span style="color:blue;">七尾中特</span>【<span style="color:#FF0000;">$$$$$$$尾</span>】开:？00准</p>`;
                let defaultHtml2 = `<p style="font-family:宋体;font-size:medium;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr2}期:<span style="color:blue;">七尾中特</span>【<span style="color:#FF0000;">$$$$$$$尾</span>】开:？00准</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:宋体;font-size:medium;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrExtra}期:<span style="color:blue;">七尾中特</span>【<span style="color:#FF0000;">$$$$$$$尾</span>】开:？00准</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = '';
        }
    }
