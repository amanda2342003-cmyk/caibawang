        361: "大数+1头", 362: "小数+4头", 363: "大数+0头", 364: "小数+3头", 365: "大数+2头", 366: "小数+4头"
    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        return STATIC_PREDICTIONS[actualKy] || "小数+4头";
    }

    // Kiểm tra chính xác vế trước, vế sau hoặc cả hai cùng trúng
    function checkHit(predictStr, numStr) {
        let num = parseInt(numStr, 10);
        if (isNaN(num) || num < 1 || num > 49) {
            return { isWin: false, hit1: false, hit2: false };
        }

        let parts = predictStr.split('+');
        let part1 = parts[0]; // 大数 / 小数
        let part2 = parts[1]; // 0头..4头

        let hit1 = false;
        if (part1 === "小数" && num >= 1 && num <= 24) hit1 = true;
        if (part1 === "大数" && num >= 25 && num <= 49) hit1 = true;

        let hit2 = false;
        if (part2 === "0头" && num >= 1 && num <= 9) hit2 = true;
        if (part2 === "1头" && num >= 10 && num <= 19) hit2 = true;
        if (part2 === "2头" && num >= 20 && num <= 29) hit2 = true;
        if (part2 === "3头" && num >= 30 && num <= 39) hit2 = true;
        if (part2 === "4头" && num >= 40 && num <= 49) hit2 = true;

        return {
            isWin: hit1 || hit2,
            hit1: hit1,
            hit2: hit2
        };
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animalB = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        let animalE = (r.c[4] && r.c[4].v !== null && r.c[4].v !== undefined) ? String(r.c[4].v).trim() : '';
                        
                        if (formattedNum) {
                            if (animalB) duLieuMapB[formattedNum] = animalB;
                            if (animalE) duLieuMapE[formattedNum] = animalE;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let lastXRowIndex = -1;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r) continue;

                    let isXRow = false;
                    for (let colIdx = 1; colIdx <= 7; colIdx++) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            if (String(r[colIdx].v).trim().toLowerCase() === 'x') {
                                isXRow = true;
                                break;
                            }
                        }
                    }

                    if (isXRow) {
                        lastXRowIndex = i;
                        continue;
                    }

                    if (!r[0] || r[0].v === null || r[0].v === undefined) continue;

                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            rowIndex: i,
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    item.useMapE = (lastXRowIndex !== -1 && item.rowIndex > lastXRowIndex);
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let winEntries = [];
            let consecutiveLosses = 0;

            for (let i = doneList.length - 1; i >= 0; i--) {
                let item = doneList[i];
                let predicted = getPredictForKy(item.kyNum);
                let hitResult = checkHit(predicted, item.numTe);
                
                if (hitResult.isWin) {
                    consecutiveLosses = 0;
                    winEntries.push({ item, predicted, hit1: hitResult.hit1, hit2: hitResult.hit2 });
                    if (winEntries.length === 14) {
                        break;
                    }
                } else {
                    consecutiveLosses++;
                    if (consecutiveLosses >= 3) {
                        break;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="font-size:16px;line-height:1.2;margin:0;">${kyStrNext}期：<span style="color:#FF0000;">大小数中特</span>＄【<span style="color:#FF0000;">${predictNext}</span>】<span style="color:#3333FF;">開：？00准</span></p>`;

            let historyOutputs = [];

            for (let i = 0; i < winEntries.length; i++) {
                let entry = winEntries[i];
                let activeMap = entry.item.useMapE ? duLieuMapE : duLieuMapB;
                let shengXiaoWin = activeMap[entry.item.numTe] || duLieuMapB[entry.item.numTe] || '';
                
                let resStrWin = shengXiaoWin + entry.item.numTe + '准';
                let kyStr = formatThreeDigits(entry.item.kyNum);
                
                let parts = entry.predicted.split('+');
                let part1Html = entry.hit1 ? `<span class="win-digit">${parts[0]}</span>` : parts[0];
                let part2Html = entry.hit2 ? `<span class="win-digit">${parts[1]}</span>` : parts[1];
                let formattedPredictHtml = `${part1Html}+${part2Html}`;

                historyOutputs.push(`<p style="font-size:16px;line-height:1.2;margin:0;">${kyStr}期：<span style="color:#FF0000;">大小数中特</span>＄【<span style="color:#FF0000;">${formattedPredictHtml}</span>】<span style="color:#3333FF;">開：${resStrWin}</span></p>`);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-size:16px;line-height:1.2;margin:0;">${kyStr1}期：<span style="color:#FF0000;">大小数中特</span>＄【<span style="color:#FF0000;">發發+$头</span>】<span style="color:#3333FF;">開：？00准</span></p>`;
                let defaultHtml2 = `<p style="font-size:16px;line-height:1.2;margin:0;">${kyStr2}期：<span style="color:#FF0000;">大小数中特</span>＄【<span style="color:#FF0000;">發發+$头</span>】<span style="color:#3333FF;">開：？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-size:16px;line-height:1.2;margin:0;">${kyStrExtra}期：<span style="color:#FF0000;">大小数中特</span>＄【<span style="color:#FF0000;">發發+$头</span>】<span style="color:#3333FF;">開：？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
