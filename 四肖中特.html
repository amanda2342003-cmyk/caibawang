    }

    }

                // Kết quả ghép Tên con giáp + Số trúng (ví dụ: 猴05)
                let resultWinStr = `${entry.shengXiaoWin}${entry.item.numTe}`;

                historyOutputs.push(`<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr}期：四肖中特→┣<span style="color:orange;">┣</span><span style="color:#FF0000;">${formattedPredictedStr}</span><span style="color:orange;">┫</span>┫←开:<span style="color:#FF0000;">${resultWinStr}准</span></p>`);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            // Dự đoán trượt quá 3 kỳ, áp dụng kỳ mặc định 發發發發
            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr1}期：四肖中特→┣<span style="color:orange;">┣</span><span style="color:#FF0000;">發發發發</span><span style="color:orange;">┫</span>┫←开:<span style="color:#FF0000;">？00准</span></p>`;
                let defaultHtml2 = `<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr2}期：四肖中特→┣<span style="color:orange;">┣</span><span style="color:#FF0000;">發發發發</span><span style="color:orange;">┫</span>┫←开:<span style="color:#FF0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrExtra}期：四肖中特→┣<span style="color:orange;">┣</span><span style="color:#FF0000;">發發發發</span><span style="color:orange;">┫</span>┫←开:<span style="color:#FF0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = '';
        }
    }
    initPredict();
</script>
