                    item.useMapE = (lastXRowIndex !== -1 && item.rowIndex > lastXRowIndex);
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let winEntries = [];
            let consecutiveLosses = 0;

            for (let i = doneList.length - 1; i >= 0; i--) {
                let item = doneList[i];
                let predictedChoice = getPredictForKy(item.kyNum);
                
                let activeMap = item.useMapE ? duLieuMapE : duLieuMapB;
                let actualShengXiao = activeMap[item.numTe] || duLieuMapB[item.numTe] || '';

                let isWin = actualShengXiao !== '' && predictedChoice.includes(actualShengXiao);
                
                if (isWin) {
                    consecutiveLosses = 0;
                    winEntries.push({ item, predicted: predictedChoice, shengXiaoWin: actualShengXiao });
                    if (winEntries.length === 14) {
                        break;
                    }
                } else {
                    consecutiveLosses++;
                    if (consecutiveLosses >= 3) {
                        break;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            // Thẻ dự đoán kì mới nhất áp dụng mã HTML và style mã gốc
            let htmlNextKy = `<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrNext}期：<span style="color:#FF0000;">五肖中特</span>→【${predictNext}】←开:<span style="color:#FF0000;">00准</span></p>`;

            let historyOutputs = [];

            for (let i = 0; i < winEntries.length; i++) {
                let entry = winEntries[i];
                let kyStr = formatThreeDigits(entry.item.kyNum);
                
                // Bôi nền vàng & chữ đỏ duy nhất con giáp trúng
                let formattedPredictedStr = "";
                for (let char of entry.predicted) {
                    if (char === entry.shengXiaoWin) {
                        formattedPredictedStr += `<span class="win-digit">${char}</span>`;
                    } else {
                        formattedPredictedStr += char;
                    }
                }

                historyOutputs.push(`<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr}期：<span style="color:#FF0000;">五肖中特</span>→【${formattedPredictedStr}】←开:<span style="color:#FF0000;">${entry.item.numTe}准</span></p>`);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            // Nếu dự đoán trượt quá 3 kỳ, áp dụng kỳ mặc định 發發發發發
            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr1}期：<span style="color:#FF0000;">五肖中特</span>→【發發發發發】←开:<span style="color:#FF0000;">00准</span></p>`;
                let defaultHtml2 = `<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr2}期：<span style="color:#FF0000;">五肖中特</span>→【發發發發發】←开:<span style="color:#FF0000;">00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:宋体;font-size:12pt;font-weight:bold;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrExtra}期：<span style="color:#FF0000;">五肖中特</span>→【發發發發發】←开:<span style="color:#FF0000;">00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = '';
        }
    }
    initPredict();
</script>

</body>
</html>
